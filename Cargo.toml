[package]
name = "knap"
version = "0.20.0"
edition = "2024"
description = "Keeps linked Markdown notes correct — links, anchors, and frontmatter tags — as an LSP server and CLI"
license = "MIT"
repository = "https://github.com/sleb/knap"
readme = "README.md"
keywords = ["lsp", "markdown", "linter", "notes", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["tests/", "docs/", "examples/"]

[dependencies]
lsp-server  = "0.10"
lsp-types   = "0.97"
pulldown-cmark = "0.13"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
log         = "0.4"
env_logger  = "0.11"
url         = "2"
crossbeam-channel = "0.5"
clap        = { version = "4", features = ["derive"] }
toml        = "1.1"
tempfile    = "3"
glob        = "0.3"

[features]
# Not part of the public API — opt-in only, re-exports test-only internals
# (see src/lib.rs) so this crate's own tests/examples can reach them without
# `server`/`handlers` being public. Enabled automatically below for dev
# builds; never enabled for a normal `cargo add knap`.
test-support = []

[dev-dependencies]
knap        = { path = ".", features = ["test-support"] }
rand        = "0.10"
